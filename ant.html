<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Brenden Brusberg, applied AI systems designer working across data science, software engineering, and organizational strategy."
    />
    <meta name="theme-color" content="#191d19" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://www.brendenbrusberg.com/" />
    <title>Brenden Brusberg | Data Scientist in Jersey City &amp; NYC</title>
    <script>
      (() => {
        if (window.parent !== window.self) document.documentElement.classList.add('is-embedded');
        if (window.top === window.self) {
          const target = new URL('/', window.location.origin);
          target.search = window.location.search;
          target.hash = 'ants';
          window.location.replace(target.href);
        }
      })();
    </script>
  </head>
  <body>
    <main class="page-shell">
      <div class="site-shell">
        <section class="simulation-panel" aria-label="Ant colony simulation">
          <canvas id="patch-canvas" tabindex="0" aria-label="Animated ant colony patch overview"></canvas>
          <div id="loading" class="status-panel">Loading colony...</div>
          <div id="error-message" class="status-panel" hidden></div>
          <section class="allocation-panel" aria-label="Colony task allocation">
            <div class="allocation-control">
              <div class="allocation-heading">
                <span>Colony</span>
                <strong>Task mix</strong>
              </div>
              <svg id="allocation-triangle" class="allocation-triangle" viewBox="0 0 100 86" role="slider" tabindex="0" aria-label="Colony task mix">
                <polygon class="allocation-field" points="50,6 8,78 92,78"></polygon>
                <line x1="50" y1="6" x2="8" y2="78"></line>
                <line x1="8" y1="78" x2="92" y2="78"></line>
                <line x1="92" y1="78" x2="50" y2="6"></line>
                <text class="allocation-label" x="19" y="43" transform="rotate(-60 19 43)" aria-hidden="true">FORAGE</text>
                <text class="allocation-label" x="50" y="86" aria-hidden="true">DIG</text>
                <text class="allocation-label" x="81" y="43" transform="rotate(60 81 43)" aria-hidden="true">NURSE</text>
                <circle id="allocation-thumb" class="allocation-thumb" cx="44" cy="52" r="5"></circle>
              </svg>
              <div class="ant-tracker" aria-label="Live ant colony tracker">
                <div>
                  <span>Ants</span>
                  <strong id="ant-count">3</strong>
                </div>
                <div>
                  <span>Food</span>
                  <strong id="food-count">8</strong>
                </div>
                <div>
                  <span>Brood</span>
                  <strong id="brood-count">0</strong>
                </div>
              </div>
              <div class="hunger-chart allocation-hunger-chart" aria-label="Worker hunger chart">
                <div class="hunger-chart-heading">
                  <span>Hunger</span>
                  <strong id="hunger-max">0%</strong>
                </div>
                <div id="hunger-bars" class="hunger-bars" aria-hidden="true"></div>
              </div>
            </div>
          </section>
        </section>

      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
